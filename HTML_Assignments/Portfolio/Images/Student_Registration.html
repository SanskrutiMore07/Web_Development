<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <form action="">
        <label for="fName">Enter First Name : </label>
        <input type="text"name="FirstName" id="fName"><br><br>

        <label for="mName">Enter Middle Name : </label>
        <input type="text"name="MiddelName" id="mName"><br><br>

         <label for="lName">Enter Last Name : </label>
        <input type="text"name="LastName" id="lName"><br><br>

         <label for="email">Enter Mail : </label>
        <input type="email"name="Email" id="email"><br><br>

         <label for="pno">Enter Phone Number : </label>
        <input type="number"name="pno" id="pno"><br><br>

        <button>Submit</button>
        <button>Refresh</button>

    </form>
</body>
</html>
