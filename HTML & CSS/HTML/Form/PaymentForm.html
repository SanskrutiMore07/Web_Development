<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <form action="" id="form">
        <h1>Payment Form</h1>
        <p class="required">Required fileds are followed by *</p>
        <h2>Contact Information</h2>
        <p>Name: * <input type="text" name="name" required></p>
       <fieldset style="width: 50%;">
        <legend>Gender *</legend>
             <p>
                Male <input type="radio" name="gender" id="gender">
            Female <input type="radio" name="gender" id="gender">
        Other <input type="radio" name="gender" id="gender" required>
    </p>
       </fieldset>
       <p>Address: <textarea name="address" id="address" cols="30" rows="5"></textarea></p>
       <p>Email: * <input type="email" name="email" id="email" required></p>
       <p>Pincode: * <input type="number" name="pincode" id="pincode" required></p>

       <h2>Payment Information</h2>
       <p>Card Type: * 
        <select name="Card_Type" id="Card_Type" required>
            <option value="">---Select A Card---</option>
            <option value="Visa">Visa</option>
              <option value="Rupay">Rupay</option>
                <option value="Mastercard">Mastercard</option>
        </select>
       </p>
       <p>
        Card Number * <input type="number" name="card_number" id="card_number" required>
       </p>
       <p>
        Expiration Date: *<input type="date" name="exp_date" id="exp_date"required>
       </p>
       <p>CVV * <input type="password" name="cvv" id="cvv" required></p>
       <input type="submit" value="pay Now" class="Button">
    </form>
</body>
</html>
